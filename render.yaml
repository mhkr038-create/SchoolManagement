databases:
  - name: school-erp-db
    databaseName: school_management
    user: school_admin
    plan: free
    region: oregon

services:
  # 1. Backend NestJS Web Service
  - type: web
    name: school-erp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @school/types build && pnpm --filter api db:generate && pnpm --filter api build
    preDeployCommand: pnpm --filter api exec prisma db push --accept-data-loss
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d

  # 2. Frontend React Vite Static Site
  - type: web
    name: school-erp-web
    runtime: static
    buildCommand: pnpm install && pnpm --filter @school/types build && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://school-erp-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html